name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements/runtime.txt \
            -r requirements/ci.txt
          python -m pip install --no-deps -e .

      - name: Verify formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Validate evaluation CLI
        run: |
          llm-eval --help
          llm-eval run --help
          llm-eval compare --help

      - name: Validate experiment CLI and offline registry
        run: |
          llm-experiment --help
          llm-experiment run --help
          llm-experiment list --help
          llm-experiment show --help
          llm-experiment compare --help
          llm-experiment alias --help
          llm-experiment verify --help
          python scripts/experiment_registry_smoke.py

      - name: Validate whitespace
        run: git diff --check

  container:
    name: Gateway image and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          LLAMA_MODEL_PATH=/tmp/ci-placeholder.gguf \
            docker compose -f compose.yaml -f compose.llama.yaml \
              --profile inference config --quiet

      - name: Build gateway image
        run: docker compose build gateway

      - name: Run model-free container smoke test
        run: python3 scripts/container_smoke.py --skip-build
